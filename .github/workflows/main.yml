name: Run Main Script
on:
  push:
    branches:
      - main
jobs:
  run-node-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'          
      - name: Run main script
        run: node main.js
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
